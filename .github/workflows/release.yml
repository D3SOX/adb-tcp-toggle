name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check version
        run: |
          version=$(sed -n 's/^version=//p' module.prop)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::module.prop version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build module zip
        run: |
          zip -r9 "adb-tcp-toggle-$GITHUB_REF_NAME.zip" module.prop ./*.sh skip_mount webroot README.md LICENSE
          jq -n \
            --arg version "$GITHUB_REF_NAME" \
            --argjson versionCode "$(sed -n 's/^versionCode=//p' module.prop)" \
            --arg zipUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/adb-tcp-toggle-$GITHUB_REF_NAME.zip" \
            --arg changelog "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/changelog.md" \
            '{$version, $versionCode, $zipUrl, $changelog}' > update.json
          cat update.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "adb-tcp-toggle-$GITHUB_REF_NAME.zip" update.json --verify-tag --generate-notes
          # Module managers show this file as the update changelog.
          gh release view "$GITHUB_REF_NAME" --json body -q .body > changelog.md
          gh release upload "$GITHUB_REF_NAME" changelog.md

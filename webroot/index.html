<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ADB over Network</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --fg: #15181d; --muted: #5d6573; --line: #e2e5ea;
    --accent: #2f6fdb; --on: #1f8a4c; --off: #6b7280; --warn: #b7791f; --bad: #c53030;
    font-family: system-ui, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --fg: #e8eaee; --muted: #9aa3b2; --line: #2a2f38;
      --accent: #7aa7ff; --on: #4ccb80; --off: #8b93a1; --warn: #f0b44c; --bad: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font-size: 15px; line-height: 1.4;
    padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-size: 22px; font-weight: 600; margin: 4px 4px 0; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 8px 4px 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }

  #status { display: grid; gap: 14px; --c: var(--off); }
  #status[data-state="on"] { --c: var(--on); }
  #status[data-state="stale"] { --c: var(--warn); }
  #status[data-state="exposed"] { --c: var(--bad); }
  .headline { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 20%, transparent); flex: none; }
  #status[aria-busy="true"] { --c: var(--accent); }
  #status[aria-busy="true"] .dot { animation: pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { to { opacity: .25; } }
  #detail { color: var(--muted); margin: -6px 0 0; }
  #connect { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 10px; padding: 4px 4px 4px 12px; }
  #connect[hidden] { display: none; }
  #connect code { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }

  button { font: inherit; border: 0; border-radius: 999px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 8px; }
  .actions button { flex: 1; font-weight: 600; padding: 12px; }
  .actions button[hidden] { display: none; }
  #apply { background: var(--accent); color: var(--card); }
  #disable { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
  #copy { background: transparent; color: var(--accent); font-weight: 600; padding: 8px 12px; flex: none; }

  #ifaces { padding: 4px 0; }
  label { display: flex; align-items: center; gap: 14px; padding: 12px 16px; cursor: pointer; }
  label + label { border-top: 1px solid var(--line); }
  input[type="radio"] { accent-color: var(--accent); width: 20px; height: 20px; margin: 0; flex: none; }
  .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .tag { font-size: 11px; font-weight: 600; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); border-radius: 6px; padding: 1px 6px; }
  .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  label > div { min-width: 0; }

  #log { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; color: var(--bad); }
  #log:empty { display: none; }
  footer { color: var(--muted); font-size: 13px; margin: 0 4px; }
</style>
</head>
<body>
<main>
  <h1>ADB over Network</h1>

  <section id="status" class="card" data-state="off" aria-live="polite">
    <div class="headline"><span class="dot"></span><span id="title">Loading…</span></div>
    <p id="detail"></p>
    <div id="connect" hidden><code id="cmd"></code><button id="copy" type="button">Copy</button></div>
    <div class="actions">
      <button id="apply" type="button" disabled>Enable</button>
      <button id="disable" type="button" hidden>Disable</button>
    </div>
    <pre id="log"></pre>
  </section>

  <h2>Allow connections via</h2>
  <form id="ifaces" class="card"></form>

  <footer>Only the selected interface can reach port <span id="port">5555</span>. TCP ADB turns off on reboot, and devices still need ADB authorization.</footer>
</main>

<script>
  const CTL = "/data/adb/modules/adb_tcp_toggle/ctl.sh";
  const $ = (id) => document.getElementById(id);
  let busy = false;
  let last;
  let gen = 0; // Bumped by every action so older status results are dropped.
  let loading = -1; // Generation of the status call in flight.
  let calls = 0;

  // ksu.exec blocks the page until the command finishes, so use ksu.spawn, which
  // streams output lines to window[name] and reports the exit code asynchronously.
  function ctl(...args) {
    return new Promise((resolve) => {
      const name = `ctl_${Date.now()}_${calls++}`;
      const out = [];
      const stream = { emit: (_, line) => out.push(line) };
      window[name] = {
        stdout: stream,
        stderr: stream,
        emit(event, code) {
          if (event !== "exit") return;
          delete window[name];
          resolve({ code, output: out.join("\n").trim() });
        },
      };
      ksu.spawn("sh", JSON.stringify([CTL, ...args]), "{}", name);
    });
  }

  const shellQuote = (s) => `'${s.replaceAll("'", `'\\''`)}'`;

  const TEXT = {
    off: ["Off", () => "TCP ADB is disabled.", "Enable"],
    on: ["On", (s) => `Reachable only via ${s.target}.`, ""],
    stale: ["Unreachable", (s) => `Firewalled to ${s.firewall}, but the selected interface is ${s.target ? `now ${s.target}` : "not available"}.`, "Re-apply"],
    exposed: ["Exposed", (s) => `adbd listens on port ${s.port} on every interface. Something else enabled TCP ADB.`, "Restrict"],
  };

  function render(s) {
    last = s;
    const [title, detail, action] = TEXT[s.state] ?? TEXT.off;
    $("status").dataset.state = s.state;
    $("title").textContent = title;
    $("detail").textContent = detail(s);
    // Re-applying needs the selected interface; disabling always works.
    const apply = s.state === "off" || (action && s.target) ? action : "";
    $("apply").textContent = apply;
    $("apply").hidden = !apply;
    $("disable").hidden = s.state === "off";
    $("disable").textContent = "Disable";
    $("port").textContent = s.port;

    const cmd = s.address ? `adb connect ${s.address}:${s.port}` : "";
    $("cmd").textContent = cmd;
    $("connect").hidden = !cmd;

    const ts = s.interfaces.find((i) => i.name === s.tailscale);
    const options = [{
      value: "tailscale",
      name: "Tailscale",
      tag: "auto",
      sub: ts ? `Currently ${ts.name} · ${ts.addresses.join(", ")}` : "Not running",
    }];
    for (const i of s.interfaces) {
      options.push({ value: i.name, name: i.name, tag: i.name === s.tailscale ? "Tailscale" : "", sub: i.addresses.join(", ") });
    }
    if (!options.some((o) => o.value === s.iface)) {
      options.push({ value: s.iface, name: s.iface, tag: "", sub: "Not present" });
    }

    const form = $("ifaces");
    form.replaceChildren(...options.map((o) => {
      const label = document.createElement("label");
      const radio = Object.assign(document.createElement("input"), { type: "radio", name: "iface", value: o.value, checked: o.value === s.iface, disabled: busy });
      const text = document.createElement("div");
      const name = Object.assign(document.createElement("div"), { className: "name", textContent: o.name });
      if (o.tag) name.append(Object.assign(document.createElement("span"), { className: "tag", textContent: o.tag }));
      text.append(name, Object.assign(document.createElement("div"), { className: "sub", textContent: o.sub }));
      label.append(radio, text);
      return label;
    }));
    $("apply").disabled = $("disable").disabled = busy;
  }

  async function refresh() {
    const g = gen;
    if (loading === g) return;
    loading = g;
    const r = await ctl("status");
    if (loading === g) loading = -1;
    if (busy || g !== gen) return;
    if (r.code === 0) {
      try { render(JSON.parse(r.output)); return; } catch {}
    }
    $("title").textContent = "Error";
    $("log").textContent = r.output || `Status failed (${r.code})`;
  }

  // Disables every control and shows what is happening before the command runs.
  async function run(label, button, ...args) {
    busy = true;
    gen++;
    if (last) render(last);
    $("status").ariaBusy = "true";
    $("title").textContent = label;
    if (button) button.textContent = label;
    $("log").textContent = "";
    const r = await ctl(...args);
    if (r.code !== 0) $("log").textContent = r.output;
    busy = false;
    $("status").ariaBusy = "false";
    await refresh();
  }

  $("apply").addEventListener("click", (e) => run(last?.state === "off" ? "Enabling…" : "Applying…", e.currentTarget, "enable"));
  $("disable").addEventListener("click", (e) => run("Disabling…", e.currentTarget, "disable"));
  $("ifaces").addEventListener("change", (e) => {
    const name = e.target.value === "tailscale" ? "Tailscale" : e.target.value;
    run(`Switching to ${name}…`, null, "set-iface", shellQuote(e.target.value));
  });
  $("copy").addEventListener("click", async () => {
    const text = $("cmd").textContent;
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      getSelection().selectAllChildren($("cmd"));
      document.execCommand("copy");
    }
    ksu.toast("Copied");
  });

  refresh();
  setInterval(() => { if (!busy && !document.hidden) refresh(); }, 3000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !busy) refresh(); });
</script>
</body>
</html>
